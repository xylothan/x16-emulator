      - uses: actions/upload-artifact@v4
        with:
          name: x16emu_macos_m1
          path: emu_binaries/*
  build-wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential make libsdl2-dev cmake
      - uses: mymindstorm/setup-emsdk@v14
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Fetch ROM
        uses: ./.github/actions/fetch-rom
        with:
          release: ${{ github.ref_type == 'tag' }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Copy ROM symbols
        run: |
          cp latest_rom/*.h src/.
      - name: Build Emulator
        run: |
          mkdir build
          cp latest_rom/rom.bin build
          cd build
          emcmake cmake .. -DENABLE_FLUIDSYNTH=OFF -DENABLE_TRACE=OFF
          emmake make
      - name: Package Emulator
        run: |
          mkdir emu_binaries
          cp build/x16emu.data build/x16emu.html build/x16emu.js build/x16emu.wasm emu_binaries/
          mkdir emu_binaries/webassembly
          cp webassembly/styles.css webassembly/main.js webassembly/jszip.min.js emu_binaries/webassembly/
          file emu_binaries/*
      - uses: actions/upload-artifact@v4
        with:
          name: x16emu_wasm
          path: emu_binaries/*

  # Attach the platform builds to a GitHub release.
  #
  # Two kinds of release come out of here:
  #
  #   * pushing an R49.nnn tag produces a full release, created as a DRAFT so a
  #     human reviews and publishes it deliberately;
  #   * pushing to the default branch refreshes a rolling "dev" prerelease, so
  #     there is always a current build to download without it ever looking
  #     like an official one.
  #
  # Until now neither existed: the workflow only uploaded workflow artifacts,
  # and publishing meant downloading each one by hand, renaming it and
  # uploading it to a release. That is easy to get wrong and, because artifacts
  # expire, impossible to redo later. Asset naming reproduces exactly what has
  # been published to date, e.g. x16emu_win64 -> x16emu_win64-R49.001.zip.
  publish:
    if: >-
      github.ref_type == 'tag' ||
      github.ref_name == github.event.repository.default_branch ||
      github.event_name == 'workflow_dispatch'
    needs:
      # Every build, not just the ones that produce assets: a red compile means
      # the tree is broken, and nothing broken should reach a release.
      - build-win-msvc
      - build-win-x86_64
      - build-win-i686
      - build-linux-x86_64
      - build-linux-aarch64
      - build-linux-armhf
      - build-macos-x86_64
      - build-macos-arm64
      - build-wasm
    runs-on: ubuntu-22.04
    permissions:
      # The default token is read-only, and creating a release needs to write.
      contents: write
    steps:
      - name: Work out which kind of release this is
        id: kind
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "dev=false"                >> "$GITHUB_OUTPUT"
            echo "name=$GITHUB_REF_NAME"    >> "$GITHUB_OUTPUT"
          else
            echo "dev=true"                 >> "$GITHUB_OUTPUT"
            echo "name=dev"                 >> "$GITHUB_OUTPUT"
          fi
      - name: Collect the platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          # Everything the builds produced, but not the README PDF, which is
          # bundled inside each platform zip rather than published on its own.
          pattern: x16emu_*
      - name: Zip each platform as <artifact>-<name>.zip
        env:
          RELEASE_NAME: ${{ steps.kind.outputs.name }}
        run: |
          set -euo pipefail
          cd dist
          for dir in */; do
            name="${dir%/}"
            (cd "$name" && zip -qr "../${name}-${RELEASE_NAME}.zip" .)
          done
          ls -l ./*.zip
      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IS_DEV: ${{ steps.kind.outputs.dev }}
          RELEASE_NAME: ${{ steps.kind.outputs.name }}
        run: |
          set -euo pipefail
          if [ "$IS_DEV" = "true" ]; then
            # Rolling prerelease: replace it wholesale so stale assets from an
            # earlier build can never linger alongside the current ones.
            gh release delete "$RELEASE_NAME" --yes --cleanup-tag \
              --repo "$GITHUB_REPOSITORY" || true
            gh release create "$RELEASE_NAME" dist/*.zip \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Development build (${GITHUB_SHA:0:7})" \
              --notes "Automated build of ${GITHUB_SHA}. Not an official release. Windows: x16emu_win* is a single self-contained exe; take a -midi package for MIDI support, or a -mingw one for \`-trace\`." \
              --prerelease
          elif gh release view "$RELEASE_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # Re-running the workflow for a tag refreshes its assets rather
            # than failing, and leaves the release's draft state alone.
            gh release upload "$RELEASE_NAME" dist/*.zip \
              --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$RELEASE_NAME" dist/*.zip \
              --repo "$GITHUB_REPOSITORY" \
              --title "$RELEASE_NAME" \
              --draft \
              --generate-notes
          fi

