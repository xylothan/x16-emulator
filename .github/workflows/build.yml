          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: x16emu_linux-armhf
          path: emu_binaries/*
  build-macos-x86_64:
    needs: [README]
    # this is currently macos-15, Sequoia
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - name: Install Dependencies
        run: |
          brew install make sdl2 fluid-synth # cmake is likely here or pulled in
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Fetch ROM
        uses: ./.github/actions/fetch-rom
        with:
          release: ${{ github.ref_type == 'tag' }}
