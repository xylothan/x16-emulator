name: Build Binaries
on:
  push:
    branches: ['**']
    # Releases are cut by pushing a tag; see the publish job at the end. AD&D
    # tags are R<upstream release>.<AD&D build>, e.g. R49.001. The lowercase
    # form is matched too, both for upstream's own r49-style tags and so a
    # mistyped tag still builds.
    tags: ['[rR]*']
  pull_request:
  workflow_dispatch:

jobs:
  README:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install Dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential make fonts-dejavu
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: Install md-to-pdf (npm)
        run: |
          npm i md-to-pdf
      - name: Create output directory
        run: |
          mkdir artifacts
      - name: Create README
        run: |
          export PATH=$(pwd)/node_modules/.bin:$PATH
          cat header_footer.md README.md RELEASES.md | md-to-pdf --config-file .gh/config.js --stylesheet .gh/markdown.css > "artifacts/README.pdf"
      - uses: actions/upload-artifact@v4
        with:
          name: readme-pdf
          path: artifacts/*
  # The Windows builds we point people at. Everything is linked statically,
  # including the CRT, so each package is a single self-contained x16emu.exe
  # with no redistributable to install. The MinGW jobs below still run, and
  # still publish, as a fallback: they keep -trace, which MSVC cannot build.
  #
  # Each architecture is built twice, with and without FluidSynth. The MIDI
  # build has the runtime loader compiled in and ships libfluidsynth-3.dll
  # beside the executable; the plain build has neither, so it does not offer
  # the MIDI options at all, which is the honest thing to hand someone who did
  # not ask for MIDI. The 32-bit and ARM64 legs also catch pointer and size_t
  # assumptions that an x86_64-only build hides.
  build-win-msvc:
    name: build-win-msvc-${{ matrix.arch }}${{ matrix.suffix }}
    needs: [README]
    runs-on: windows-2022
    strategy:
      # One combination failing should not hide the state of the others.
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, platform: x64,   triplet: x64-windows-x16emu,   midi: 'OFF', features: '',     suffix: '',      package: x16emu_win64 }
          - { arch: x86_64, platform: x64,   triplet: x64-windows-x16emu,   midi: 'ON',  features: 'midi', suffix: '-midi', package: x16emu_win64-midi }
          - { arch: i686,   platform: Win32, triplet: x86-windows-x16emu,   midi: 'OFF', features: '',     suffix: '',      package: x16emu_win32 }
          - { arch: i686,   platform: Win32, triplet: x86-windows-x16emu,   midi: 'ON',  features: 'midi', suffix: '-midi', package: x16emu_win32-midi }
          - { arch: arm64,  platform: ARM64, triplet: arm64-windows-x16emu, midi: 'OFF', features: '',     suffix: '',      package: x16emu_win-arm64 }
          - { arch: arm64,  platform: ARM64, triplet: arm64-windows-x16emu, midi: 'ON',  features: 'midi', suffix: '-midi', package: x16emu_win-arm64-midi }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch ROM
        uses: ./.github/actions/fetch-rom
        with:
          release: ${{ github.ref_type == 'tag' }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Configure
        shell: pwsh
        # The generator has to be named explicitly: without it CMake falls back
        # to "NMake Makefiles", which rejects -A. Dependencies come from the
        # vcpkg preinstalled on the runner, driven by the vcpkg.json manifest
        # and the packaging triplets in vcpkg-triplets/.
        #
        # ENABLE_TRACE stays off: the generated src/rom_lst.h contains a string
        # literal of about 17 KB, and MSVC caps string literals at 16380 bytes
        # (C2026), so a trace-enabled build cannot compile. GCC has no such
        # limit, so the MinGW packages below still ship -trace.
        #
        # FluidSynth is a manifest feature, so only the MIDI legs pay for
        # building it.
        run: >
          cmake -B build -G "Visual Studio 17 2022" -A ${{ matrix.platform }}
          "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
          "-DVCPKG_OVERLAY_TRIPLETS=${{ github.workspace }}/vcpkg-triplets"
          -DVCPKG_TARGET_TRIPLET=${{ matrix.triplet }}
          -DVCPKG_MANIFEST_FEATURES=${{ matrix.features }}
          -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded
          -DENABLE_FLUIDSYNTH=${{ matrix.midi }}
          -DENABLE_TRACE=OFF
      - name: Build
        shell: pwsh
        run: cmake --build build --config Release
      - name: Package Emulator
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force emu_binaries | Out-Null
          Copy-Item build/Release/x16emu.exe   emu_binaries/
          Copy-Item build/Release/makecart.exe emu_binaries/
          Copy-Item sdcard.img.zip             emu_binaries/
          Copy-Item latest_rom/rom.bin         emu_binaries/
          Copy-Item latest_rom/*.sym           emu_binaries/
          # This leg was built with FluidSynth compiled in; ship the DLL its
          # runtime loader looks for beside the executable.
          if ('${{ matrix.midi }}' -eq 'ON') {
            Copy-Item build/vcpkg_installed/${{ matrix.triplet }}/bin/libfluidsynth-3.dll emu_binaries/
          }
          Get-ChildItem emu_binaries
      - uses: actions/download-artifact@v4
        with:
          name: readme-pdf
          path: emu_binaries
      - name: Fetch x16-docs PDFs
        # The docs artifact lives in another repository and expires, so it is
        # advisory only: never fail an emulator build because it is unavailable.
        continue-on-error: true
        shell: pwsh
        run: gh run download -R X16Community/x16-docs -n x16-docs-pdf --dir emu_binaries
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.package }}
          path: emu_binaries/*
  build-win-x86_64:
    needs: [README]
    runs-on: windows-2022
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: make git mingw-w64-x86_64-toolchain mingw-w64-x86_64-SDL2 mingw-w64-x86_64-fluidsynth mingw-w64-x86_64-cmake
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Fetch ROM
        uses: ./.github/actions/fetch-rom
        with:
          release: ${{ github.ref_type == 'tag' }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Copy ROM symbols
        run: |
          cp latest_rom/*.h src/.
      - name: Build Emulator
        run: |
          git reset --hard
          git diff
          mkdir build
          cd build
          cmake .. -DENABLE_FLUIDSYNTH=ON -DENABLE_TRACE=ON
          cmake --build .
      - name: Package Emulator
        run: |
          mkdir emu_binaries
          cp $(which SDL2.dll) emu_binaries/.
          cp $(which zlib1.dll) emu_binaries/.
          cp $(which libwinpthread-1.dll) emu_binaries/.
          cp $(which libfluidsynth-3.dll) emu_binaries/.
          cp $(which libgcc_s_seh-1.dll) emu_binaries/.
          cp $(which libglib-2.0-0.dll) emu_binaries/.
          cp $(which libgmodule-2.0-0.dll) emu_binaries/.
          cp $(which libportaudio.dll) emu_binaries/.
          cp $(which libintl-8.dll) emu_binaries/.
          cp $(which libstdc++-6.dll) emu_binaries/.
          cp $(which libgomp-1.dll) emu_binaries/.
          cp $(which libreadline8.dll) emu_binaries/.
          cp $(which libsndfile-1.dll) emu_binaries/.
          cp $(which libpcre2-8-0.dll) emu_binaries/.
          cp $(which libiconv-2.dll) emu_binaries/.
          cp $(which libtermcap-0.dll) emu_binaries/.
          cp $(which libFLAC.dll) emu_binaries/.
          cp $(which libmp3lame-0.dll) emu_binaries/.
          cp $(which libmpg123-0.dll) emu_binaries/.
          cp $(which libogg-0.dll) emu_binaries/.
          cp $(which libopus-0.dll) emu_binaries/.
          cp $(which libvorbis-0.dll) emu_binaries/.
          cp $(which libvorbisenc-2.dll) emu_binaries/.
          cp sdcard.img.zip emu_binaries/.
          cp build/x16emu.exe emu_binaries/.
          cp build/makecart.exe emu_binaries/.
          file emu_binaries/*
      - name: Copy ROM
        run: |
          cp latest_rom/rom.bin emu_binaries/.
          cp latest_rom/*.sym emu_binaries/.
      - uses: actions/download-artifact@v4
        with:
          name: readme-pdf
          path: emu_binaries
      - name: Fetch x16-docs PDFs
        # The docs artifact lives in another repository and expires, so it is
        # advisory only: never fail an emulator build because it is unavailable.
        continue-on-error: true
        run: gh run download -R X16Community/x16-docs -n x16-docs-pdf --dir emu_binaries
        shell: cmd
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: x16emu_win64-mingw
          path: emu_binaries/*
