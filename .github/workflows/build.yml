name: Build Binaries
on:
  push:
    # Other branches build through their pull request, so that a commit is not
    # built once for the push and again for the PR.
    branches: [main]
    # Releases are cut by pushing a tag; see the publish job at the end. ADD
    # tags are R<upstream release>.<ADD build>, e.g. R49.001. The lowercase
    # form is matched too, both for upstream's own r49-style tags and so a
    # mistyped tag still builds.
    tags: ['[rR]*']
  pull_request:
  workflow_dispatch:

# A new commit replaces a PR's running build. main and tags are never cancelled
# while running, because publish could be part-way through moving the dev
# release; a newer run still replaces one that is only waiting.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The ROM testbench/machine_golden.json was recorded with. The goldens depend
# on it, so the jobs that check them use this one rather than whatever x16-rom
# built last.
env:
  GOLDEN_ROM_TAG: r49
  GOLDEN_ROM_SHA256: b81654cc8c87ed96e3ffc7c8e7c312c9f3b7b870c7bb34de61e61eac931b819a

# The platform jobs are grouped by operating system rather than listed one per
# architecture: windows, windows-legacy, linux, macos and wasm. Each group is a
# matrix, so the run summary collapses to five boxes instead of a wall of
# fourteen, and the legs of a group share one copy of their steps.
jobs:
  # Everything this workflow produces is stamped with a single build
  # identifier, worked out once here so no two artifacts in a run can disagree.
  #
  # A tag build is simply the tag. Anything else is a rolling development build
  # named <base>-dev-<YYYYMMDD>.<NNN>, e.g. r49-dev-20260810.003, where:
  #
  #   * <base> is the upstream release this fork sits on. It is read from the
  #     newest R<n>.<m> tag once one exists, so cutting R49.001 makes this
  #     self-maintaining; until then it falls back to DEV_BASE_FALLBACK. It is
  #     deliberately not read from src/version.h, which carries upstream's
  #     in-development number (50 / "next") rather than the release we sit on.
  #   * <NNN> counts the commits that landed on this branch that UTC day, so
  #     the name means "the third check-in of the tenth" and can be worked out
  #     again later from the history alone.
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Only bump this if the first tag ends up cut against a different
      # upstream release; after that the tags themselves take over.
      DEV_BASE_FALLBACK: r49
    outputs:
      build: ${{ steps.v.outputs.build }}
      release: ${{ steps.v.outputs.release }}
      dev: ${{ steps.v.outputs.dev }}
    steps:
      - name: Work out the build identifier
        id: v
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            {
              echo "dev=false"
              echo "release=$GITHUB_REF_NAME"
              echo "build=$GITHUB_REF_NAME"
            } >> "$GITHUB_OUTPUT"
            echo "Build identifier: $GITHUB_REF_NAME (tag)"
            exit 0
          fi

          # Newest R<n>.<m> tag wins; sort -V so R10 beats R9.
          base="$(gh api "repos/$GITHUB_REPOSITORY/tags?per_page=100" --jq '.[].name' \
                  | grep -Ei '^r[0-9]+\.' | sort -V | tail -n1 || true)"
          if [ -n "$base" ]; then
            base="$(printf '%s' "${base%%.*}" | tr '[:upper:]' '[:lower:]')"
          else
            base="$DEV_BASE_FALLBACK"
          fi

          # --paginate emits one array per page, so sum the lengths.
          seq="$(gh api --paginate \
                   "repos/$GITHUB_REPOSITORY/commits?sha=$GITHUB_SHA&since=$(date -u +%Y-%m-%d)T00:00:00Z" \
                   --jq 'length' | awk '{ s += $1 } END { print s + 0 }')"
          [ "$seq" -gt 0 ] || seq=1

          build="$(printf '%s-dev-%s.%03d' "$base" "$(date -u +%Y%m%d)" "$seq")"
          {
            echo "dev=true"
            echo "release=dev"
            echo "build=$build"
          } >> "$GITHUB_OUTPUT"
          echo "Build identifier: $build"
  README:
    needs: [version]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - name: Install Dependencies
        uses: ./.github/actions/apt-install
        with:
          packages: fonts-dejavu
      - uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
      - name: Install md-to-pdf (npm)
        run: |
          npm i md-to-pdf
      - name: Allow Chrome's sandbox
        # Ubuntu 23.10+ blocks the unprivileged user namespaces it needs.
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Create output directory
        run: |
          mkdir artifacts
      - name: Create README
        env:
          BUILD_VERSION: ${{ needs.version.outputs.build }}
        run: |
          set -euo pipefail
          export PATH=$(pwd)/node_modules/.bin:$PATH
          # The build identifier goes into the PDF as well as into the zip, so
          # a README that has been copied out of a package still says which
          # build it came from.
          printf '\n---\n\nBuild `%s` (%s)\n' "$BUILD_VERSION" "${GITHUB_SHA:0:7}" > build_stamp.md
          # .gh/header_footer.md is front matter for md-to-pdf -- page size,
          # margins, running header and page numbers -- so it has to come
          # first. It used to be catted as "header_footer.md", which does not
          # exist; cat failed, the pipeline swallowed it because only md-to-pdf's
          # status was checked, and every PDF shipped without any of it. Hence
          # the pipefail above.
          cat .gh/header_footer.md README.md RELEASES.md build_stamp.md | md-to-pdf --config-file .gh/config.js --stylesheet .gh/markdown.css > "artifacts/README.pdf"
      - uses: actions/upload-artifact@v7
        with:
          name: readme-pdf
          path: artifacts/*
  # The unit tests: three standalone binaries covering the cc65 debug-info
  # parser, the anchored disassembler and the debugger breakpoint core. Each one
  # stubs out the emulator core, so this job needs no ROM, no FluidSynth and no
  # packaging -- it is by far the cheapest job here and it is the only one that
  # actually executes any code, so it runs unconditionally rather than hanging
  # off README like the platform builds do.
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      # buildtables.py generates cpu/tables.h and cpu/mnemonics.h; CMake looks
      # for a Python 3 interpreter unconditionally.
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - name: Install Dependencies
        # SDL2 and zlib are found by find_package() at configure time, and
        # disasm.c pulls in SDL headers, so they are needed even though nothing
        # here links the emulator.
        uses: ./.github/actions/apt-install
        with:
          packages: build-essential cmake libsdl2-dev zlib1g-dev iverilog
      - name: Configure
        # LTO off: it buys nothing for three small binaries and costs link time.
        run: cmake -B build -DBUILD_TESTS=ON -DENABLE_LTO=OFF -DENABLE_FLUIDSYNTH=OFF -DENABLE_TRACE=OFF
      - name: Fetch CPU test images
        # Klaus Dormann's functional tests. Not committed: GPL, and 64K each.
        # The test reports them skipped if this step is removed or fails.
        run: python tests/fetch_klaus.py
      - name: Fetch VERA RTL
        # Someone else's repository under its own licence, so it is fetched
        # rather than committed. check_vera_palette.py compares the default
        # palette against the memory file baked into VERA's bitstream and
        # skips without it, so CI would otherwise never run that check.
        run: python tests/fetch_vera_rtl.py
      - name: Build Tests
        # One aggregate target rather than a bare --build, so a broken emulator
        # build is reported by the platform jobs and not duplicated here, and
        # rather than a list of names, so adding a test stays a one-line change
        # in CMakeLists.txt and cannot leave ctest running an executable that
        # was never compiled.
        run: cmake --build build --target unit_tests
      - name: Run Tests
        # X16_KLAUS_REQUIRED and X16_VERA_RTL_REQUIRED make a missing fixture a
        # failure rather than a skip, so removing or breaking a fetch step above
        # shows up as a red test instead of a green run that checked nothing.
        #
        # Run verbose into a log rather than straight to the console: ctest only
        # shows a passing test's output on failure, which would hide a known
        # divergence behind a green tick. The log is dumped on failure, and any
        # divergence is raised as a warning annotation so it is visible on a
        # run that otherwise passed.
        env:
          X16_KLAUS_REQUIRED: 1
          X16_VERA_RTL_REQUIRED: 1
          X16_VERA_DIFF_REQUIRED: 1
        run: |
          if ! ctest --test-dir build -V > ctest.log 2>&1; then
            cat ctest.log
            exit 1
          fi
          grep -E 'Test #|tests passed|tests failed' ctest.log || true
          if grep -q 'DIVERGE:' ctest.log; then
            echo
            grep -A1 'DIVERGE:' ctest.log
            n=$(grep -c 'DIVERGE:' ctest.log)
            echo "::warning title=Known hardware divergences::$n known difference(s) from real hardware. See the DIVERGE lines in this job's log."
          fi
      - name: Upload the per-opcode report
        # The baseline says how many cases pass; this says what the failures
        # look like.
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: processor-tests-report
          path: pt-report-*.txt
          if-no-files-found: ignore
  # Break the emulator on purpose and check the tests notice. Every test is
  # written to pass against correct behaviour, which says nothing about whether
  # it would catch incorrect behaviour; this is the half that does. Kept out of
  # unit-tests because it rebuilds once per mutation, and split four ways so
  # the list can grow without the run outgrowing its timeout.
  mutation-shard:
    name: mutation-tests (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      # Every shard runs to the end, so one run reports every survivor.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - name: Install Dependencies
        uses: ./.github/actions/apt-install
        with:
          packages: build-essential cmake libsdl2-dev zlib1g-dev
      - name: Configure
        run: cmake -B build -DBUILD_TESTS=ON -DENABLE_LTO=OFF -DENABLE_FLUIDSYNTH=OFF -DENABLE_TRACE=OFF
      - name: Fetch CPU test images
        run: python tests/fetch_klaus.py
      - name: Fetch VERA RTL
        # The default-palette mutation is only meaningful with the reference
        # present: without it check_vera_palette.py skips, the mutation
        # survives, and this job fails for a reason that has nothing to do
        # with the mutation.
        run: python tests/fetch_vera_rtl.py
      - name: Check the tests catch faults
        env:
          X16_KLAUS_REQUIRED: 1
          X16_VERA_RTL_REQUIRED: 1
        run: python tests/mutation_check.py --build-dir build --shard ${{ matrix.shard }}/4
  # The faults in the list itself, found without running a mutant: a pattern
  # the source has moved away from, a test that does not exist, or a mutant
  # that does not compile under this compiler's warnings.
  mutation-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - name: Install Dependencies
        uses: ./.github/actions/apt-install
        with:
          packages: build-essential cmake libsdl2-dev zlib1g-dev
      - name: Configure
        # The shards' configuration, plus the compile commands each mutant is
        # compiled with.
        run: cmake -B build -DBUILD_TESTS=ON -DENABLE_LTO=OFF -DENABLE_FLUIDSYNTH=OFF -DENABLE_TRACE=OFF -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
      - name: Build
        # Generated headers have to exist before a mutant can be compiled.
        run: cmake --build build -j"$(nproc)"
      - name: Check the mutations
        run: python tests/mutation_check.py --build-dir build --check
  # One result for the shards and the check together.
  mutation-tests:
    if: always()
    needs: [mutation-shard, mutation-check]
    runs-on: ubuntu-latest
    steps:
      - name: Every shard and the check passed
        run: |
          test "${{ needs.mutation-shard.result }}" = success
          test "${{ needs.mutation-check.result }}" = success
  # Save states load into any build of the same SAVESTATE_MACHINE_VERSION, which
  # is only safe while those builds all run the machine identically. This runs
  # fixed workloads from power-on and compares their state hashes with
  # testbench/machine_golden.json; a difference means the machine changed and
  # the version must be bumped. The ROM is pinned, because the goldens depend on
  # it and the platform jobs take whatever x16-rom built last.
  machine-version:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - name: Install Dependencies
        # xauth is only a recommend of xvfb, and xvfb-run needs it.
        uses: ./.github/actions/apt-install
        with:
          packages: build-essential cmake libsdl2-dev libcjson-dev zlib1g-dev xvfb xauth
      - name: Fetch the pinned ROM
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p pinned_rom
          gh release download "$GOLDEN_ROM_TAG" -R X16Community/x16-rom --pattern '*.zip' --dir pinned_rom
          unzip -o pinned_rom/*.zip rom.bin -d pinned_rom
          echo "$GOLDEN_ROM_SHA256  pinned_rom/rom.bin" | sha256sum -c -
      - name: Build Emulator
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DENABLE_FLUIDSYNTH=OFF -DENABLE_TRACE=OFF
          cmake --build build -j"$(nproc)"
      - name: Check the machine against its goldens
        # No display and no sound card here; the emulator runs -hidden on SDL's
        # dummy drivers, under a virtual X server in case the video driver
        # wants one.
        env:
          SDL_AUDIODRIVER: dummy
        run: xvfb-run -a python testbench/test_machine_version.py build/x16emu pinned_rom/rom.bin
      - name: Fetch the DAP schema
        run: python tests/fetch_dap_schema.py
      - name: Check the debug server against the DAP specification
        env:
          SDL_AUDIODRIVER: dummy
          X16_DAP_SCHEMA_REQUIRED: 1
        run: xvfb-run -a python testbench/test_dap_conformance.py build/x16emu pinned_rom/rom.bin
      - name: Check the MCP server
        env:
          SDL_AUDIODRIVER: dummy
        run: xvfb-run -a python testbench/test_mcp.py build/x16emu pinned_rom/rom.bin
  # The Windows builds we point people at. Everything is linked statically,
  # including the CRT, so each package is a single self-contained x16emu.exe
  # with no redistributable to install. The MinGW jobs in windows-legacy still
  # run, and still publish, as a fallback: they keep -trace, which MSVC cannot
  # build.
  #
  # Each architecture is built twice, with and without FluidSynth. The MIDI
  # build has the runtime loader compiled in and ships libfluidsynth-3.dll
  # beside the executable; the plain build has neither, so it does not offer
  # the MIDI options at all, which is the honest thing to hand someone who did
  # not ask for MIDI. The 32-bit and ARM64 legs also catch pointer and size_t
  # assumptions that an x86_64-only build hides.
  #
  # Pull requests build the plain legs only; the -midi legs differ by one vcpkg
  # feature and build on main and tags. The plain x86_64 leg also runs the unit
  # suite under MSVC.
  windows:
    name: windows (${{ matrix.arch }}${{ matrix.midi == 'ON' && '-midi' || '' }})
    needs: [version]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      MIDI_SUFFIX: ${{ matrix.midi == 'ON' && '-midi' || '' }}
      VCPKG_FEATURES: ${{ matrix.midi == 'ON' && 'midi' || '' }}
    strategy:
      # One combination failing should not hide the state of the others.
      fail-fast: false
      matrix:
        arch: [x86_64, i686, arm64]
        midi: ['OFF', 'ON']
        exclude:
          - midi: ${{ github.event_name == 'pull_request' && 'ON' || 'none' }}
        # Only keys that every surviving combination matches: an include entry
        # that matches nothing becomes a job of its own.
        include:
          - { arch: x86_64, runner: windows-latest, platform: x64,   triplet: x64-windows-x16emu,   package: x16emu_win64 }
          - { arch: i686,   runner: windows-latest, platform: Win32, triplet: x86-windows-x16emu,   package: x16emu_win32 }
          - { arch: arm64,  runner: windows-11-arm, platform: ARM64, triplet: arm64-windows-x16emu, package: x16emu_win-arm64 }
          - { arch: x86_64, midi: 'OFF', tests: true }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - name: Fetch ROM
        uses: ./.github/actions/fetch-rom
        with:
          release: ${{ github.ref_type == 'tag' }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: ./.github/actions/msvc-cmake
      - name: Set up the vcpkg binary cache
        # vcpkg rebuilds SDL2 (and FluidSynth) from source on every run without
        # one. The image version is in the key because a new vcpkg tool can
        # change the package hashes.
        id: vcpkg-cache
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'vcpkg-cache'
          New-Item -ItemType Directory -Force $dir | Out-Null
          Add-Content $env:GITHUB_ENV "VCPKG_BINARY_SOURCES=clear;files,$dir,readwrite"
          Add-Content $env:GITHUB_OUTPUT "dir=$dir"
          Add-Content $env:GITHUB_OUTPUT "image=$env:ImageOS-$env:ImageVersion"
      - uses: actions/cache@v6
        with:
          path: ${{ steps.vcpkg-cache.outputs.dir }}
          key: vcpkg-${{ matrix.triplet }}-${{ env.VCPKG_FEATURES }}-${{ steps.vcpkg-cache.outputs.image }}-${{ hashFiles('vcpkg.json', 'vcpkg-triplets/**') }}
          restore-keys: |
            vcpkg-${{ matrix.triplet }}-${{ env.VCPKG_FEATURES }}-
      - name: Configure
        # msvc-cmake selects the generator: without one CMake falls back to
        # "NMake Makefiles", which rejects -A. Dependencies come from the
        # vcpkg preinstalled on the runner, driven by the vcpkg.json manifest
        # and the packaging triplets in vcpkg-triplets/.
        #
        # ENABLE_TRACE stays off: the generated src/rom_lst.h contains a string
        # literal of about 17 KB, and MSVC caps string literals at 16380 bytes
        # (C2026), so a trace-enabled build cannot compile. GCC has no such
        # limit, so the MinGW packages in windows-legacy still ship -trace.
        #
        # FluidSynth is a manifest feature, so only the MIDI legs pay for
        # building it.
        run: >
          cmake -B build -A ${{ matrix.platform }}
          "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
          "-DVCPKG_OVERLAY_TRIPLETS=${{ github.workspace }}/vcpkg-triplets"
          -DVCPKG_TARGET_TRIPLET=${{ matrix.triplet }}
          -DVCPKG_MANIFEST_FEATURES=${{ env.VCPKG_FEATURES }}
          -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded
          -DENABLE_FLUIDSYNTH=${{ matrix.midi }}
          -DENABLE_TRACE=OFF
      - name: Build
        run: cmake --build build --config Release
      - name: Check the machine against its goldens
        # The machine-version job's guard, on MSVC: these hashes must equal the
        # goldens whichever compiler recorded them, which is what lets a save
        # state cross toolchains. The 32-bit leg checks a 32-bit build too. The
        # ARM64 legs skip it; the MIDI legs are the same machine.
        if: ${{ matrix.midi == 'OFF' && matrix.arch != 'arm64' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SDL_AUDIODRIVER: dummy
        run: |
          New-Item -ItemType Directory -Force pinned_rom | Out-Null
          gh release download $env:GOLDEN_ROM_TAG -R X16Community/x16-rom --pattern '*.zip' --dir pinned_rom
          Expand-Archive -Force (Get-ChildItem pinned_rom/*.zip).FullName pinned_rom/x
          $h = (Get-FileHash pinned_rom/x/rom.bin -Algorithm SHA256).Hash.ToLower()
          if ($h -ne $env:GOLDEN_ROM_SHA256) { throw "the pinned ROM's SHA-256 is $h" }
          python testbench/test_machine_version.py build/Release/x16emu.exe pinned_rom/x/rom.bin
      - name: Configure Tests
        # Its own tree, configured as the unit suite expects: LTO, FluidSynth
        # and trace off.
        if: ${{ matrix.tests }}
        run: >
          cmake -B build-tests -A x64
          "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
          "-DVCPKG_OVERLAY_TRIPLETS=${{ github.workspace }}/vcpkg-triplets"
          -DVCPKG_TARGET_TRIPLET=x64-windows-x16emu
          -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded
          -DBUILD_TESTS=ON
          -DENABLE_LTO=OFF
          -DENABLE_FLUIDSYNTH=OFF
          -DENABLE_TRACE=OFF
      - name: Fetch CPU test images
        if: ${{ matrix.tests }}
        run: python tests/fetch_klaus.py
      - name: Fetch VERA RTL
        if: ${{ matrix.tests }}
        run: python tests/fetch_vera_rtl.py
      - name: Build Tests
        if: ${{ matrix.tests }}
        run: cmake --build build-tests --config Release --target unit_tests
      - name: Run Tests
        if: ${{ matrix.tests }}
        env:
          X16_KLAUS_REQUIRED: 1
          X16_VERA_RTL_REQUIRED: 1
        run: ctest --test-dir build-tests -C Release --output-on-failure
      - name: Package Emulator
        run: |
          New-Item -ItemType Directory -Force emu_binaries | Out-Null
          Copy-Item build/Release/x16emu.exe   emu_binaries/
          Copy-Item build/Release/makecart.exe emu_binaries/
          # This leg was built with FluidSynth compiled in; ship the DLL its
          # runtime loader looks for beside the executable.
          if ('${{ matrix.midi }}' -eq 'ON') {
            Copy-Item build/vcpkg_installed/${{ matrix.triplet }}/bin/libfluidsynth-3.dll emu_binaries/
          }
      - uses: ./.github/actions/package-common
        with:
          build: ${{ needs.version.outputs.build }}
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.package }}${{ env.MIDI_SUFFIX }}
          path: emu_binaries/*
  # The original MinGW packages, kept because they are the only Windows builds
  # with -trace and because they are what long-time users already have. They
  # ship a couple of dozen DLLs beside the executable, which is exactly what
  # the MSVC builds above exist to avoid.
  windows-legacy:
    name: windows-legacy (${{ matrix.arch }})
    needs: [version]
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: msys2 {0}
    strategy:
      fail-fast: false
      matrix:
        include:
          # 64-bit only: MSYS2 no longer carries 32-bit (MINGW32) SDL2 or
          # FluidSynth. The MSVC jobs above still ship 32-bit Windows builds.
          - { arch: x86_64, msystem: MINGW64, prefix: x86_64, path_type: minimal, package: x16emu_win64-mingw }
    steps:
      - uses: actions/checkout@v7
      - uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          update: true
          install: make git mingw-w64-${{ matrix.prefix }}-toolchain mingw-w64-${{ matrix.prefix }}-SDL2 mingw-w64-${{ matrix.prefix }}-fluidsynth mingw-w64-${{ matrix.prefix }}-cmake mingw-w64-${{ matrix.prefix }}-ntldd
          path-type: ${{ matrix.path_type }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - name: Fetch ROM
        uses: ./.github/actions/fetch-rom
        with:
          release: ${{ github.ref_type == 'tag' }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Copy ROM symbols
        run: |
          cp latest_rom/*.h src/.
      - name: Build Emulator
        run: |
          mkdir build
          cd build
          cmake .. -DENABLE_FLUIDSYNTH=ON -DENABLE_TRACE=ON
          cmake --build .
      - name: Package Emulator
        # The DLLs the binaries actually need, not a hardcoded list: that list
        # broke the day fluidsynth stopped depending on glib2 and
        # libglib-2.0-0.dll was no longer installed at all.
        run: |
          set -euo pipefail
          mkdir emu_binaries
          cp build/x16emu.exe build/makecart.exe emu_binaries/.

          # midi.c LoadLibrary()s fluidsynth instead of linking it, so it is
          # in no import table: name it here, and walk its dependencies too --
          # most of the old list was fluidsynth's, not the emulator's.
          midi_dll=$MSYSTEM_PREFIX/bin/libfluidsynth-3.dll
          cp "$midi_dll" emu_binaries/.

          # ntldd -R walks the whole chain and prints Windows paths; keep only
          # what resolves inside the MSYS2 prefix, since the rest ships with
          # Windows. cygpath -m puts both sides in one comparable form.
          prefix=$(cygpath -m "$MSYSTEM_PREFIX" | tr 'A-Z' 'a-z')
          ntldd -R build/x16emu.exe build/makecart.exe "$midi_dll" | tr -d '\r' |
            sed -n 's|^.* => \(.*\) (0x[0-9a-fA-F]*)$|\1|p' | sort -u > found.txt
          : > dlls.txt
          while read -r dll; do
            win=$(cygpath -m "$dll" 2>/dev/null) || continue
            case $(printf %s "$win" | tr 'A-Z' 'a-z') in
              "$prefix"/*) printf '%s\n' "$win" >> dlls.txt ;;
            esac
          done < found.txt

          # An empty list would package the exes with no DLLs and still pass.
          if [ ! -s dlls.txt ]; then
            echo "::error title=No DLLs found::ntldd resolved nothing under $MSYSTEM_PREFIX"
            exit 1
          fi
          xargs -a dlls.txt -I{} cp {} emu_binaries/.
          echo "::notice title=Bundled DLLs::$(cd emu_binaries && ls ./*.dll | sed 's|^\./||' | tr '\n' ' ')"
          for want in SDL2.dll libfluidsynth-3.dll; do
            if [ ! -f "emu_binaries/$want" ]; then
              echo "::error title=Missing DLL::$want was not bundled"
              exit 1
            fi
          done
          rm -f found.txt dlls.txt
          file emu_binaries/*
      - uses: ./.github/actions/package-common
        with:
          build: ${{ needs.version.outputs.build }}
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.package }}
          path: emu_binaries/*
  # x86_64 builds on the runner itself. aarch64 builds natively on an arm64
  # runner inside Debian 11, the release Raspberry Pi OS 2022-04-04 is built
  # on, so the binary needs no newer glibc than those images. armhf cannot run
  # on GitHub's arm64 machines, so it is built inside a Raspberry Pi OS image
  # under qemu; arm-runner-action needs qemu-user-static, which Ubuntu 26.04
  # does not ship, hence ubuntu-24.04 for that leg.
  linux:
    name: linux (${{ matrix.arch }})
    needs: [version]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64,  runner: ubuntu-latest,    package: x16emu_linux-x86_64 }
          - { arch: aarch64, runner: ubuntu-24.04-arm, container: 'debian:bullseye', package: x16emu_linux-aarch64 }
          - { arch: armhf,   runner: ubuntu-24.04,     emulated: true, base_image: 'raspios_lite:2022-04-04', cpu: cortex-a7, package: x16emu_linux-armhf }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        if: ${{ !matrix.container }}
        with:
          python-version: '3.x'
      - name: Install Dependencies
        if: ${{ !matrix.emulated && !matrix.container }}
        uses: ./.github/actions/apt-install
        with:
          packages: build-essential make libsdl2-dev libfluidsynth-dev libcjson-dev cmake
      - name: Install Dependencies
        # The emulated legs need only enough to run the ARM image; the build
        # dependencies are installed inside it.
        if: ${{ matrix.emulated }}
        uses: ./.github/actions/apt-install
        with:
          packages: build-essential make qemu-user-static
      - name: Fetch ROM
        uses: ./.github/actions/fetch-rom
        with:
          release: ${{ github.ref_type == 'tag' }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Copy ROM symbols
        run: |
          cp latest_rom/*.h src/.
      - name: Build Emulator
        if: ${{ !matrix.emulated && !matrix.container }}
        run: |
          mkdir build
          cd build
          cmake .. -DENABLE_FLUIDSYNTH=ON -DENABLE_TRACE=ON
          cmake --build .
      - name: Build Emulator
        if: ${{ matrix.container }}
        env:
          IMAGE: ${{ matrix.container }}
        run: |
          docker run --rm -i -e HOST_IDS="$(id -u):$(id -g)" -v "$PWD:/src" -w /src "$IMAGE" bash -euxo pipefail -s <<'EOF'
          # Debian 11 is past LTS; its security pool, and in time the main one,
          # live on archive.debian.org.
          sed -Ei 's#https?://[^ ]+/debian-security#http://archive.debian.org/debian-security#g' /etc/apt/sources.list
          if ! apt-get -o Acquire::Check-Valid-Until=false update; then
            sed -i 's|deb\.debian\.org|archive.debian.org|g' /etc/apt/sources.list
            apt-get -o Acquire::Check-Valid-Until=false update
          fi
          apt-get install -y --no-install-recommends build-essential cmake file git python3 \
            libsdl2-dev libfluidsynth-dev libcjson-dev zlib1g-dev
          git config --global --add safe.directory /src
          cmake -B build -DENABLE_FLUIDSYNTH=ON -DENABLE_TRACE=ON
          cmake --build build -j"$(nproc)"
          mkdir emu_binaries
          cp build/x16emu build/makecart emu_binaries/
          file emu_binaries/*
          chown -R "$HOST_IDS" build emu_binaries
          EOF
      - name: Package Emulator
        if: ${{ !matrix.emulated && !matrix.container }}
        run: |
          mkdir emu_binaries
          cp build/x16emu emu_binaries/.
          cp build/makecart emu_binaries/.
          file emu_binaries/*
      - name: Build Emulator
        if: ${{ matrix.emulated }}
        uses: pguyot/arm-runner-action@v2
        with:
          base_image: ${{ matrix.base_image }}
          image_additional_mb: 8192
          cpu: ${{ matrix.cpu }}
          copy_artifact_path: emu_binaries
          commands: |
            # Debian 11 went EOL on 2026-08-31 and its .debs have since left
            # security.debian.org's pool: apt still resolves the deb11uN
            # security versions from the index, then 404s downloading them
            # (exit 100). archive.debian.org still serves them. A no-op on
            # armhf, which takes everything from Raspbian's own mirrors.
            grep -rlE 'security\.debian\.org' /etc/apt/sources.list /etc/apt/sources.list.d 2>/dev/null | xargs -r sed -i 's|security\.debian\.org/debian-security|archive.debian.org/debian-security|g' || true
            apt-get -o Acquire::Check-Valid-Until=false update
            apt-get install -y build-essential make libsdl2-dev file git libfluidsynth-dev libcjson-dev cmake
            mkdir build
            cd build
            cmake .. -DENABLE_FLUIDSYNTH=ON -DENABLE_TRACE=ON
            cmake --build .
            cd ..
            mkdir emu_binaries
            cp build/x16emu emu_binaries/.
            cp build/makecart emu_binaries/.
            file emu_binaries/*
      - name: Take ownership of the image's output
        # arm-runner-action copies its artifacts back out owned by root.
        if: ${{ matrix.emulated }}
        run: sudo chown -R runner emu_binaries
      - name: Report the newest glibc symbol required
        run: |
          v=$(readelf -W --dyn-syms emu_binaries/x16emu | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -n1)
          echo "::notice title=linux (${{ matrix.arch }}) glibc::x16emu needs $v"
      - uses: ./.github/actions/package-common
        with:
          build: ${{ needs.version.outputs.build }}
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.package }}
          path: emu_binaries/*
  macos:
    name: macos (${{ matrix.arch }})
    needs: [version]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # Intel has no free -latest label.
          - { arch: x86_64, runner: macos-15-intel, package: x16emu_macos_intel }
          - { arch: arm64,  runner: macos-latest,   package: x16emu_macos_m1 }
    steps:
      - uses: actions/checkout@v7
      - name: Install Dependencies
        run: |
          brew install make sdl2 fluid-synth # cmake is likely here or pulled in
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - name: Fetch ROM
        uses: ./.github/actions/fetch-rom
        with:
          release: ${{ github.ref_type == 'tag' }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Copy ROM symbols
        run: |
          cp latest_rom/*.h src/.
      - name: Build Emulator
        run: |
          mkdir build
          cd build
          cmake .. -DENABLE_FLUIDSYNTH=ON -DENABLE_TRACE=ON
          cmake --build .
      - name: Package Emulator
        run: |
          mkdir emu_binaries
          cp build/x16emu emu_binaries/.
          cp build/makecart emu_binaries/.
          file emu_binaries/*
      - uses: ./.github/actions/package-common
        with:
          build: ${{ needs.version.outputs.build }}
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.package }}
          path: emu_binaries/*
  wasm:
    needs: [version]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Install Dependencies
        uses: ./.github/actions/apt-install
        with:
          packages: build-essential make libsdl2-dev cmake
      - uses: mymindstorm/setup-emsdk@v16
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - name: Fetch ROM
        uses: ./.github/actions/fetch-rom
        with:
          release: ${{ github.ref_type == 'tag' }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Copy ROM symbols
        run: |
          cp latest_rom/*.h src/.
      - name: Build Emulator
        run: |
          mkdir build
          cp latest_rom/rom.bin build
          cd build
          emcmake cmake .. -DENABLE_FLUIDSYNTH=OFF -DENABLE_TRACE=OFF
          emmake make
      - name: Package Emulator
        run: |
          mkdir emu_binaries
          cp build/x16emu.data build/x16emu.html build/x16emu.js build/x16emu.wasm emu_binaries/
          mkdir emu_binaries/webassembly
          cp webassembly/styles.css webassembly/main.js webassembly/jszip.min.js emu_binaries/webassembly/
          file emu_binaries/*
          printf '%s\n' '${{ needs.version.outputs.build }}' > emu_binaries/BUILD_VERSION.txt
      - uses: actions/upload-artifact@v7
        with:
          name: x16emu_wasm
          path: emu_binaries/*

  # Attach the platform builds to a GitHub release.
  #
  # Two kinds of release come out of here:
  #
  #   * pushing an R49.nnn tag produces a full release, created as a DRAFT so a
  #     human reviews and publishes it deliberately;
  #   * pushing to the default branch refreshes a rolling "dev" prerelease, so
  #     there is always a current build to download without it ever looking
  #     like an official one.
  #
  # The dev release keeps a fixed tag and fixed asset names, so a link to
  # .../releases/download/dev/x16emu_win64-dev.zip is good forever. Which build
  # it actually is shows up in the release title and notes, in BUILD_VERSION.txt
  # inside every package, and on the last page of the bundled README.
  #
  # Every run assembles the zips, so a pull request shows exactly what would
  # ship; only the Publish step is limited to tags and the default branch.
  publish:
    needs:
      # Every build, not just the ones that produce assets: a red compile means
      # the tree is broken, and nothing broken should reach a release. The unit
      # tests gate it for the same reason.
      - version
      - README
      - unit-tests
      - windows
      - windows-legacy
      - linux
      - macos
      - wasm
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      # The default token is read-only, and creating a release needs to write.
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      IS_DEV: ${{ needs.version.outputs.dev }}
      RELEASE_NAME: ${{ needs.version.outputs.release }}
      BUILD_VERSION: ${{ needs.version.outputs.build }}
    steps:
      - name: Collect the platform artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          # Everything the builds produced, but not the README PDF, which is
          # bundled inside each platform zip rather than published on its own.
          pattern: x16emu_*
      - uses: actions/download-artifact@v8
        with:
          name: readme-pdf
          path: extras
      - name: Fetch x16-docs PDFs
        # The docs artifact lives in another repository and expires, so it is
        # advisory only: never fail a release because it is unavailable.
        continue-on-error: true
        run: gh run download -R X16Community/x16-docs -n x16-docs-pdf --dir extras
      - name: Add the README and docs to each desktop package
        run: |
          set -euo pipefail
          ls -l extras
          for dir in dist/*/; do
            [ "$dir" = dist/x16emu_wasm/ ] && continue
            cp -r extras/. "$dir"
          done
      - name: Zip each platform as <artifact>-<name>.zip
        run: |
          set -euo pipefail
          cd dist
          for dir in */; do
            name="${dir%/}"
            (cd "$name" && zip -qr "../${name}-${RELEASE_NAME}.zip" .)
          done
          for z in ./*.zip; do
            echo "== $z"
            unzip -Z1 "$z" | sort
          done
      - name: Publish
        if: >-
          github.ref_type == 'tag' ||
          github.ref_name == github.event.repository.default_branch
        run: |
          set -euo pipefail

          # The API returns the occasional 5xx, and losing a complete set of
          # platform builds to one of them is not acceptable: a full run costs
          # the better part of an hour. Every write goes through here.
          retry() {
            local attempt
            for attempt in 1 2 3; do
              if "$@"; then
                return 0
              fi
              echo "::warning::attempt ${attempt}/3 failed: $*"
              sleep $(( attempt * 10 ))
            done
            echo "::error::giving up after 3 attempts: $*"
            return 1
          }

          notes="$(printf '%s\n\n%s\n\n%s' \
            "Automated build \`${BUILD_VERSION}\` of ${GITHUB_SHA}. Not an official release." \
            "Windows: \`x16emu_win*\` is a single self-contained exe; take a \`-midi\` package for MIDI support, or a \`-mingw\` one for \`-trace\`." \
            "Every package carries \`BUILD_VERSION.txt\` naming the build it came from. Asset names are stable, so these download links stay valid as the build rolls forward.")"

          if [ "$IS_DEV" = "true" ]; then
            # The rolling prerelease is updated in place. It used to be deleted
            # and recreated, which left a window with no dev release at all --
            # and a 502 on the create call turned that window permanent.
            if ! gh release view "$RELEASE_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              retry gh release create "$RELEASE_NAME" \
                --repo "$GITHUB_REPOSITORY" \
                --target "$GITHUB_SHA" \
                --title "Development build $BUILD_VERSION" \
                --notes "$notes" \
                --prerelease
            fi

            retry gh release upload "$RELEASE_NAME" dist/*.zip \
              --repo "$GITHUB_REPOSITORY" --clobber

            # Asset names are stable, so --clobber replaced them in place. Only
            # a package that has gone away entirely needs cleaning up, which is
            # what the old delete-and-recreate was really for.
            keep="$(cd dist && ls ./*.zip | sed 's#^\./##')"
            gh release view "$RELEASE_NAME" --repo "$GITHUB_REPOSITORY" \
              --json assets --jq '.assets[].name' > published_assets.txt
            while read -r asset; do
              [ -n "$asset" ] || continue
              if ! grep -Fxq "$asset" <<<"$keep"; then
                echo "Removing stale asset $asset"
                retry gh release delete-asset "$RELEASE_NAME" "$asset" \
                  --repo "$GITHUB_REPOSITORY" --yes
              fi
            done < published_assets.txt

            # gh release edit --target will not move a tag that already exists,
            # so move the ref directly; otherwise the dev tag drifts behind the
            # build its release names.
            if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_NAME" >/dev/null 2>&1; then
              retry gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/$RELEASE_NAME" \
                -f sha="$GITHUB_SHA" -F force=true >/dev/null
            else
              retry gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" \
                -f ref="refs/tags/$RELEASE_NAME" -f sha="$GITHUB_SHA" >/dev/null
            fi

            retry gh release edit "$RELEASE_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Development build $BUILD_VERSION" \
              --notes "$notes" \
              --prerelease
          elif gh release view "$RELEASE_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # Re-running the workflow for a tag refreshes its assets rather
            # than failing, and leaves the release's draft state alone.
            retry gh release upload "$RELEASE_NAME" dist/*.zip \
              --repo "$GITHUB_REPOSITORY" --clobber
          else
            retry gh release create "$RELEASE_NAME" dist/*.zip \
              --repo "$GITHUB_REPOSITORY" \
              --title "$RELEASE_NAME" \
              --draft \
              --generate-notes
          fi
