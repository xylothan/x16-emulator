  build-macos-arm64:
    needs: [README]
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Install Dependencies
        run: | 
          brew install make sdl2 fluid-synth
      - uses: actions/setup-python@v5
        with:
