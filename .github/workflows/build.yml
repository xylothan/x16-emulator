name: Build Binaries
on:
  push:
    branches: ['**']
    # Releases are cut by pushing a tag; see the publish job at the end. ADD
    # tags are R<upstream release>.<ADD build>, e.g. R49.001. The lowercase
    # form is matched too, both for upstream's own r49-style tags and so a
    # mistyped tag still builds.
    tags: ['[rR]*']
  pull_request:
  workflow_dispatch:

# The platform jobs are grouped by operating system rather than listed one per
# architecture: windows, windows-legacy, linux, macos and wasm. Each group is a
# matrix, so the run summary collapses to five boxes instead of a wall of
# fourteen, and the legs of a group share one copy of their steps.
jobs:
  # Everything this workflow produces is stamped with a single build
  # identifier, worked out once here so no two artifacts in a run can disagree.
  #
  # A tag build is simply the tag. Anything else is a rolling development build
  # named <base>-dev-<YYYYMMDD>.<NNN>, e.g. r49-dev-20260810.003, where:
  #
  #   * <base> is the upstream release this fork sits on. It is read from the
  #     newest R<n>.<m> tag once one exists, so cutting R49.001 makes this
  #     self-maintaining; until then it falls back to DEV_BASE_FALLBACK. It is
  #     deliberately not read from src/version.h, which carries upstream's
  #     in-development number (50 / "next") rather than the release we sit on.
  #   * <NNN> counts the commits that landed on this branch that UTC day, so
  #     the name means "the third check-in of the tenth" and can be worked out
  #     again later from the history alone.
  version:
    runs-on: ubuntu-22.04
    env:
      # Only bump this if the first tag ends up cut against a different
      # upstream release; after that the tags themselves take over.
      DEV_BASE_FALLBACK: r49
    outputs:
      build: ${{ steps.v.outputs.build }}
      release: ${{ steps.v.outputs.release }}
      dev: ${{ steps.v.outputs.dev }}
    steps:
      - name: Work out the build identifier
        id: v
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            {
              echo "dev=false"
              echo "release=$GITHUB_REF_NAME"
              echo "build=$GITHUB_REF_NAME"
            } >> "$GITHUB_OUTPUT"
            echo "Build identifier: $GITHUB_REF_NAME (tag)"
            exit 0
          fi

          # Newest R<n>.<m> tag wins; sort -V so R10 beats R9.
          base="$(gh api "repos/$GITHUB_REPOSITORY/tags?per_page=100" --jq '.[].name' \
                  | grep -Ei '^r[0-9]+\.' | sort -V | tail -n1 || true)"
          if [ -n "$base" ]; then
            base="$(printf '%s' "${base%%.*}" | tr '[:upper:]' '[:lower:]')"
          else
            base="$DEV_BASE_FALLBACK"
          fi

          # --paginate emits one array per page, so sum the lengths.
          seq="$(gh api --paginate \
                   "repos/$GITHUB_REPOSITORY/commits?sha=$GITHUB_SHA&since=$(date -u +%Y-%m-%d)T00:00:00Z" \
                   --jq 'length' | awk '{ s += $1 } END { print s + 0 }')"
          [ "$seq" -gt 0 ] || seq=1

          build="$(printf '%s-dev-%s.%03d' "$base" "$(date -u +%Y%m%d)" "$seq")"
          {
            echo "dev=true"
            echo "release=dev"
            echo "build=$build"
          } >> "$GITHUB_OUTPUT"
          echo "Build identifier: $build"
  README:
    needs: [version]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install Dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential make fonts-dejavu
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: Install md-to-pdf (npm)
        run: |
          npm i md-to-pdf
      - name: Create output directory
        run: |
          mkdir artifacts
      - name: Create README
        env:
          BUILD_VERSION: ${{ needs.version.outputs.build }}
        run: |
          set -euo pipefail
          export PATH=$(pwd)/node_modules/.bin:$PATH
          # The build identifier goes into the PDF as well as into the zip, so
          # a README that has been copied out of a package still says which
          # build it came from.
          printf '\n---\n\nBuild `%s` (%s)\n' "$BUILD_VERSION" "${GITHUB_SHA:0:7}" > build_stamp.md
          # .gh/header_footer.md is front matter for md-to-pdf -- page size,
          # margins, running header and page numbers -- so it has to come
          # first. It used to be catted as "header_footer.md", which does not
          # exist; cat failed, the pipeline swallowed it because only md-to-pdf's
          # status was checked, and every PDF shipped without any of it. Hence
          # the pipefail above.
          cat .gh/header_footer.md README.md RELEASES.md build_stamp.md | md-to-pdf --config-file .gh/config.js --stylesheet .gh/markdown.css > "artifacts/README.pdf"
      - uses: actions/upload-artifact@v4
        with:
          name: readme-pdf
          path: artifacts/*
  # The unit tests: three standalone binaries covering the cc65 debug-info
  # parser, the anchored disassembler and the debugger breakpoint core. Each one
  # stubs out the emulator core, so this job needs no ROM, no FluidSynth and no
  # packaging -- it is by far the cheapest job here and it is the only one that
  # actually executes any code, so it runs unconditionally rather than hanging
  # off README like the platform builds do.
  unit-tests:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      # buildtables.py generates cpu/tables.h and cpu/mnemonics.h; CMake looks
      # for a Python 3 interpreter unconditionally.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Install Dependencies
        # SDL2 and zlib are found by find_package() at configure time, and
        # disasm.c pulls in SDL headers, so they are needed even though nothing
        # here links the emulator.
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libsdl2-dev zlib1g-dev
      - name: Configure
        # LTO off: it buys nothing for three small binaries and costs link time.
        run: cmake -B build -DBUILD_TESTS=ON -DENABLE_LTO=OFF -DENABLE_FLUIDSYNTH=OFF -DENABLE_TRACE=OFF
      - name: Fetch CPU test images
        # Klaus Dormann's functional tests. Not committed: GPL, and 64K each.
        # The test reports them skipped if this step is removed or fails.
        run: python tests/fetch_klaus.py
      - name: Build Tests
        # One aggregate target rather than a bare --build, so a broken emulator
        # build is reported by the platform jobs and not duplicated here, and
        # rather than a list of names, so adding a test stays a one-line change
        # in CMakeLists.txt and cannot leave ctest running an executable that
        # was never compiled.
        run: cmake --build build --target unit_tests
      - name: Run Tests
        # X16_KLAUS_REQUIRED makes a missing test image a failure rather than a
        # skip, so removing or breaking the fetch step above shows up as a red
        # test instead of a green run that checked nothing.
        #
        # Run verbose into a log rather than straight to the console: ctest only
        # shows a passing test's output on failure, which would hide a known
        # divergence behind a green tick. The log is dumped on failure, and any
        # divergence is raised as a warning annotation so it is visible on a
        # run that otherwise passed.
        env:
          X16_KLAUS_REQUIRED: 1
        run: |
          if ! ctest --test-dir build -V > ctest.log 2>&1; then
            cat ctest.log
            exit 1
          fi
          grep -E 'Test #|tests passed|tests failed' ctest.log || true
          if grep -q 'DIVERGE:' ctest.log; then
            echo
            grep -A1 'DIVERGE:' ctest.log
            n=$(grep -c 'DIVERGE:' ctest.log)
            echo "::warning title=Known hardware divergences::$n known difference(s) from real hardware. See the DIVERGE lines in this job's log."
          fi
      - name: Upload the per-opcode report
        # The baseline says how many cases pass; this says what the failures
        # look like.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: processor-tests-report
          path: pt-report-*.txt
          if-no-files-found: ignore
  # Break the emulator on purpose and check the tests notice. Every test is
  # written to pass against correct behaviour, which says nothing about whether
  # it would catch incorrect behaviour; this is the half that does. Kept out of
  # unit-tests because it rebuilds once per mutation.
  mutation-tests:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libsdl2-dev zlib1g-dev
      - name: Configure
        run: cmake -B build -DBUILD_TESTS=ON -DENABLE_LTO=OFF -DENABLE_FLUIDSYNTH=OFF -DENABLE_TRACE=OFF
      - name: Fetch CPU test images
        run: python tests/fetch_klaus.py
      - name: Check the tests catch faults
        env:
          X16_KLAUS_REQUIRED: 1
        run: python tests/mutation_check.py --build-dir build
  # The Windows builds we point people at. Everything is linked statically,
  # including the CRT, so each package is a single self-contained x16emu.exe
  # with no redistributable to install. The MinGW jobs in windows-legacy still
  # run, and still publish, as a fallback: they keep -trace, which MSVC cannot
  # build.
  #
  # Each architecture is built twice, with and without FluidSynth. The MIDI
  # build has the runtime loader compiled in and ships libfluidsynth-3.dll
  # beside the executable; the plain build has neither, so it does not offer
  # the MIDI options at all, which is the honest thing to hand someone who did
  # not ask for MIDI. The 32-bit and ARM64 legs also catch pointer and size_t
  # assumptions that an x86_64-only build hides.
  windows:
    name: windows (${{ matrix.arch }}${{ matrix.suffix }})
    needs: [version, README]
    runs-on: windows-2022
    strategy:
      # One combination failing should not hide the state of the others.
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, platform: x64,   triplet: x64-windows-x16emu,   midi: 'OFF', features: '',     suffix: '',      package: x16emu_win64 }
          - { arch: x86_64, platform: x64,   triplet: x64-windows-x16emu,   midi: 'ON',  features: 'midi', suffix: '-midi', package: x16emu_win64-midi }
          - { arch: i686,   platform: Win32, triplet: x86-windows-x16emu,   midi: 'OFF', features: '',     suffix: '',      package: x16emu_win32 }
          - { arch: i686,   platform: Win32, triplet: x86-windows-x16emu,   midi: 'ON',  features: 'midi', suffix: '-midi', package: x16emu_win32-midi }
          - { arch: arm64,  platform: ARM64, triplet: arm64-windows-x16emu, midi: 'OFF', features: '',     suffix: '',      package: x16emu_win-arm64 }
          - { arch: arm64,  platform: ARM64, triplet: arm64-windows-x16emu, midi: 'ON',  features: 'midi', suffix: '-midi', package: x16emu_win-arm64-midi }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch ROM
        uses: ./.github/actions/fetch-rom
        with:
          release: ${{ github.ref_type == 'tag' }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Configure
        # The generator has to be named explicitly: without it CMake falls back
        # to "NMake Makefiles", which rejects -A. Dependencies come from the
        # vcpkg preinstalled on the runner, driven by the vcpkg.json manifest
        # and the packaging triplets in vcpkg-triplets/.
        #
        # ENABLE_TRACE stays off: the generated src/rom_lst.h contains a string
        # literal of about 17 KB, and MSVC caps string literals at 16380 bytes
        # (C2026), so a trace-enabled build cannot compile. GCC has no such
        # limit, so the MinGW packages in windows-legacy still ship -trace.
        #
        # FluidSynth is a manifest feature, so only the MIDI legs pay for
        # building it.
        run: >
          cmake -B build -G "Visual Studio 17 2022" -A ${{ matrix.platform }}
          "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
          "-DVCPKG_OVERLAY_TRIPLETS=${{ github.workspace }}/vcpkg-triplets"
          -DVCPKG_TARGET_TRIPLET=${{ matrix.triplet }}
          -DVCPKG_MANIFEST_FEATURES=${{ matrix.features }}
          -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded
          -DENABLE_FLUIDSYNTH=${{ matrix.midi }}
          -DENABLE_TRACE=OFF
      - name: Build
        run: cmake --build build --config Release
      - name: Package Emulator
        run: |
          New-Item -ItemType Directory -Force emu_binaries | Out-Null
          Copy-Item build/Release/x16emu.exe   emu_binaries/
          Copy-Item build/Release/makecart.exe emu_binaries/
          Copy-Item sdcard.img.zip             emu_binaries/
          Copy-Item latest_rom/rom.bin         emu_binaries/
          Copy-Item latest_rom/*.sym           emu_binaries/
          # This leg was built with FluidSynth compiled in; ship the DLL its
          # runtime loader looks for beside the executable.
          if ('${{ matrix.midi }}' -eq 'ON') {
            Copy-Item build/vcpkg_installed/${{ matrix.triplet }}/bin/libfluidsynth-3.dll emu_binaries/
          }
          Get-ChildItem emu_binaries
      - uses: actions/download-artifact@v4
        with:
          name: readme-pdf
          path: emu_binaries
      - name: Fetch x16-docs PDFs
        # The docs artifact lives in another repository and expires, so it is
        # advisory only: never fail an emulator build because it is unavailable.
        continue-on-error: true
        run: gh run download -R X16Community/x16-docs -n x16-docs-pdf --dir emu_binaries
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Stamp build version
        run: Set-Content -Path emu_binaries/BUILD_VERSION.txt -Value '${{ needs.version.outputs.build }}'
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.package }}
          path: emu_binaries/*
  # The original MinGW packages, kept because they are the only Windows builds
  # with -trace and because they are what long-time users already have. They
  # ship a couple of dozen DLLs beside the executable, which is exactly what
  # the MSVC builds above exist to avoid.
  windows-legacy:
    name: windows-legacy (${{ matrix.arch }})
    needs: [version, README]
    runs-on: windows-2022
    defaults:
      run:
        shell: msys2 {0}
    strategy:
      fail-fast: false
      matrix:
        include:
          # path-type inherit on the 32-bit leg exposes the runner's own PATH
          # inside MSYS2; minimal is the action's default and what the 64-bit
          # leg has always used.
          - { arch: x86_64, msystem: MINGW64, prefix: x86_64, path_type: minimal, package: x16emu_win64-mingw }
          - { arch: i686,   msystem: MINGW32, prefix: i686,   path_type: inherit, package: x16emu_win32-mingw }
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          update: true
          install: make git mingw-w64-${{ matrix.prefix }}-toolchain mingw-w64-${{ matrix.prefix }}-SDL2 mingw-w64-${{ matrix.prefix }}-fluidsynth mingw-w64-${{ matrix.prefix }}-cmake
          path-type: ${{ matrix.path_type }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Fetch ROM
        uses: ./.github/actions/fetch-rom
        with:
          release: ${{ github.ref_type == 'tag' }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Copy ROM symbols
        run: |
          cp latest_rom/*.h src/.
      - name: Build Emulator
        run: |
          git reset --hard
          git diff
          mkdir build
          cd build
          cmake .. -DENABLE_FLUIDSYNTH=ON -DENABLE_TRACE=ON
          cmake --build .
      - name: Package Emulator
        run: |
          mkdir emu_binaries
          cp $(which SDL2.dll) emu_binaries/.
          cp $(which zlib1.dll) emu_binaries/.
          cp $(which libwinpthread-1.dll) emu_binaries/.
          cp $(which libfluidsynth-3.dll) emu_binaries/.
          cp $(which libgcc_s_seh-1.dll) emu_binaries/.
          cp $(which libglib-2.0-0.dll) emu_binaries/.
          cp $(which libgmodule-2.0-0.dll) emu_binaries/.
          cp $(which libportaudio.dll) emu_binaries/.
          cp $(which libintl-8.dll) emu_binaries/.
          cp $(which libstdc++-6.dll) emu_binaries/.
          cp $(which libgomp-1.dll) emu_binaries/.
          cp $(which libreadline8.dll) emu_binaries/.
          cp $(which libsndfile-1.dll) emu_binaries/.
          cp $(which libpcre2-8-0.dll) emu_binaries/.
          cp $(which libiconv-2.dll) emu_binaries/.
          cp $(which libtermcap-0.dll) emu_binaries/.
          cp $(which libFLAC.dll) emu_binaries/.
          cp $(which libmp3lame-0.dll) emu_binaries/.
          cp $(which libmpg123-0.dll) emu_binaries/.
          cp $(which libogg-0.dll) emu_binaries/.
          cp $(which libopus-0.dll) emu_binaries/.
          cp $(which libvorbis-0.dll) emu_binaries/.
          cp $(which libvorbisenc-2.dll) emu_binaries/.
          cp sdcard.img.zip emu_binaries/.
          cp build/x16emu.exe emu_binaries/.
          cp build/makecart.exe emu_binaries/.
          file emu_binaries/*
      - name: Copy ROM
        run: |
          cp latest_rom/rom.bin emu_binaries/.
          cp latest_rom/*.sym emu_binaries/.
      - uses: actions/download-artifact@v4
        with:
          name: readme-pdf
          path: emu_binaries
      - name: Fetch x16-docs PDFs
        # The docs artifact lives in another repository and expires, so it is
        # advisory only: never fail an emulator build because it is unavailable.
        #
        # Run from cmd rather than the MSYS2 shell so it does not depend on
        # gh being visible inside MSYS2, which varies with path-type.
        continue-on-error: true
        shell: cmd
        run: gh run download -R X16Community/x16-docs -n x16-docs-pdf --dir emu_binaries
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Stamp build version
        run: echo '${{ needs.version.outputs.build }}' > emu_binaries/BUILD_VERSION.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.package }}
          path: emu_binaries/*
  # x86_64 builds natively on the runner. The two ARM legs cannot, so they are
  # built inside a Raspberry Pi OS image under qemu, which is slow but is the
  # only way to get a genuinely native ARM binary out of a GitHub runner.
  linux:
    name: linux (${{ matrix.arch }})
    needs: [version, README]
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64,  emulated: false, package: x16emu_linux-x86_64 }
          - { arch: aarch64, emulated: true,  base_image: 'raspios_lite_arm64:2022-04-04', cpu: cortex-a53, package: x16emu_linux-aarch64 }
          - { arch: armhf,   emulated: true,  base_image: 'raspios_lite:2022-04-04',       cpu: cortex-a7,  package: x16emu_linux-armhf }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Install Dependencies
        if: ${{ !matrix.emulated }}
        run: |
          sudo cp /etc/apt/sources.list /etc/apt/sources.list~
          sudo sed -Ei 's/^# deb-src /deb-src /' /etc/apt/sources.list
          sudo apt-get update
          sudo apt-get install -y build-essential make libsdl2-dev libfluidsynth-dev libcjson-dev cmake
      - name: Install Dependencies
        # The emulated legs need only enough to run the ARM image; the build
        # dependencies are installed inside it.
        if: ${{ matrix.emulated }}
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential make qemu-user-static
      - name: Fetch ROM
        uses: ./.github/actions/fetch-rom
        with:
          release: ${{ github.ref_type == 'tag' }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Copy ROM symbols
        run: |
          cp latest_rom/*.h src/.
      - name: Build Emulator
        if: ${{ !matrix.emulated }}
        run: |
          git reset --hard
          git diff
          mkdir build
          cd build
          cmake .. -DENABLE_FLUIDSYNTH=ON -DENABLE_TRACE=ON
          cmake --build .
      - name: Package Emulator
        if: ${{ !matrix.emulated }}
        run: |
          mkdir emu_binaries
          cp sdcard.img.zip emu_binaries/.
          cp build/x16emu emu_binaries/.
          cp build/makecart emu_binaries/.
          file emu_binaries/*
      - name: Build Emulator
        if: ${{ matrix.emulated }}
        uses: pguyot/arm-runner-action@v2
        with:
          base_image: ${{ matrix.base_image }}
          image_additional_mb: 8192
          cpu: ${{ matrix.cpu }}
          copy_artifact_path: emu_binaries
          commands: |
            apt-get update
            apt-get install -y build-essential make libsdl2-dev file git libfluidsynth-dev libcjson-dev cmake
            mkdir build
            cd build
            git reset --hard
            cmake .. -DENABLE_FLUIDSYNTH=ON -DENABLE_TRACE=ON
            cmake --build .
            cd ..
            mkdir emu_binaries
            cp sdcard.img.zip emu_binaries/.
            cp build/x16emu emu_binaries/.
            cp build/makecart emu_binaries/.
            file emu_binaries/*
      - name: Copy ROM
        run: |
          # arm-runner-action copies its artifacts back out owned by root.
          sudo chown -R runner emu_binaries
          cp latest_rom/rom.bin emu_binaries/.
          cp latest_rom/*.sym emu_binaries/.
      - uses: actions/download-artifact@v4
        with:
          name: readme-pdf
          path: emu_binaries
      - name: Fetch x16-docs PDFs
        # The docs artifact lives in another repository and expires, so it is
        # advisory only: never fail an emulator build because it is unavailable.
        continue-on-error: true
        run: gh run download -R X16Community/x16-docs -n x16-docs-pdf --dir emu_binaries
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Stamp build version
        run: echo '${{ needs.version.outputs.build }}' > emu_binaries/BUILD_VERSION.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.package }}
          path: emu_binaries/*
  macos:
    name: macos (${{ matrix.arch }})
    needs: [version, README]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macos-15-intel is currently Sequoia.
          - { arch: x86_64, runner: macos-15-intel, python: '3.9',  package: x16emu_macos_intel }
          - { arch: arm64,  runner: macos-14,       python: '3.10', package: x16emu_macos_m1 }
    steps:
      - uses: actions/checkout@v4
      - name: Install Dependencies
        run: |
          brew install make sdl2 fluid-synth # cmake is likely here or pulled in
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Fetch ROM
        uses: ./.github/actions/fetch-rom
        with:
          release: ${{ github.ref_type == 'tag' }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Copy ROM symbols
        run: |
          cp latest_rom/*.h src/.
      - name: Build Emulator
        run: |
          mkdir build
          cd build
          cmake .. -DENABLE_FLUIDSYNTH=ON -DENABLE_TRACE=ON
          cmake --build .
      - name: Package Emulator
        run: |
          mkdir emu_binaries
          cp sdcard.img.zip emu_binaries/.
          cp build/x16emu emu_binaries/.
          cp build/makecart emu_binaries/.
          file emu_binaries/*
      - name: Copy ROM
        run: |
          cp latest_rom/rom.bin emu_binaries/.
          cp latest_rom/*.sym emu_binaries/.
      - uses: actions/download-artifact@v4
        with:
          name: readme-pdf
          path: emu_binaries
      - name: Fetch x16-docs PDFs
        # The docs artifact lives in another repository and expires, so it is
        # advisory only: never fail an emulator build because it is unavailable.
        continue-on-error: true
        run: gh run download -R X16Community/x16-docs -n x16-docs-pdf --dir emu_binaries
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Stamp build version
        run: echo '${{ needs.version.outputs.build }}' > emu_binaries/BUILD_VERSION.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.package }}
          path: emu_binaries/*
  wasm:
    needs: [version]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential make libsdl2-dev cmake
      - uses: mymindstorm/setup-emsdk@v14
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Fetch ROM
        uses: ./.github/actions/fetch-rom
        with:
          release: ${{ github.ref_type == 'tag' }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Copy ROM symbols
        run: |
          cp latest_rom/*.h src/.
      - name: Build Emulator
        run: |
          mkdir build
          cp latest_rom/rom.bin build
          cd build
          emcmake cmake .. -DENABLE_FLUIDSYNTH=OFF -DENABLE_TRACE=OFF
          emmake make
      - name: Package Emulator
        run: |
          mkdir emu_binaries
          cp build/x16emu.data build/x16emu.html build/x16emu.js build/x16emu.wasm emu_binaries/
          mkdir emu_binaries/webassembly
          cp webassembly/styles.css webassembly/main.js webassembly/jszip.min.js emu_binaries/webassembly/
          file emu_binaries/*
      - name: Stamp build version
        run: echo '${{ needs.version.outputs.build }}' > emu_binaries/BUILD_VERSION.txt
      - uses: actions/upload-artifact@v4
        with:
          name: x16emu_wasm
          path: emu_binaries/*

  # Attach the platform builds to a GitHub release.
  #
  # Two kinds of release come out of here:
  #
  #   * pushing an R49.nnn tag produces a full release, created as a DRAFT so a
  #     human reviews and publishes it deliberately;
  #   * pushing to the default branch refreshes a rolling "dev" prerelease, so
  #     there is always a current build to download without it ever looking
  #     like an official one.
  #
  # The dev release keeps a fixed tag and fixed asset names, so a link to
  # .../releases/download/dev/x16emu_win64-dev.zip is good forever. Which build
  # it actually is shows up in the release title and notes, in BUILD_VERSION.txt
  # inside every package, and on the last page of the bundled README.
  publish:
    if: >-
      github.ref_type == 'tag' ||
      github.ref_name == github.event.repository.default_branch ||
      github.event_name == 'workflow_dispatch'
    needs:
      # Every build, not just the ones that produce assets: a red compile means
      # the tree is broken, and nothing broken should reach a release. The unit
      # tests gate it for the same reason.
      - version
      - unit-tests
      - windows
      - windows-legacy
      - linux
      - macos
      - wasm
    runs-on: ubuntu-22.04
    permissions:
      # The default token is read-only, and creating a release needs to write.
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      IS_DEV: ${{ needs.version.outputs.dev }}
      RELEASE_NAME: ${{ needs.version.outputs.release }}
      BUILD_VERSION: ${{ needs.version.outputs.build }}
    steps:
      - name: Collect the platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          # Everything the builds produced, but not the README PDF, which is
          # bundled inside each platform zip rather than published on its own.
          pattern: x16emu_*
      - name: Zip each platform as <artifact>-<name>.zip
        run: |
          set -euo pipefail
          cd dist
          for dir in */; do
            name="${dir%/}"
            (cd "$name" && zip -qr "../${name}-${RELEASE_NAME}.zip" .)
          done
          ls -l ./*.zip
      - name: Publish
        run: |
          set -euo pipefail

          # The API returns the occasional 5xx, and losing a complete set of
          # platform builds to one of them is not acceptable: a full run costs
          # the better part of an hour. Every write goes through here.
          retry() {
            local attempt
            for attempt in 1 2 3; do
              if "$@"; then
                return 0
              fi
              echo "::warning::attempt ${attempt}/3 failed: $*"
              sleep $(( attempt * 10 ))
            done
            echo "::error::giving up after 3 attempts: $*"
            return 1
          }

          notes="$(printf '%s\n\n%s\n\n%s' \
            "Automated build \`${BUILD_VERSION}\` of ${GITHUB_SHA}. Not an official release." \
            "Windows: \`x16emu_win*\` is a single self-contained exe; take a \`-midi\` package for MIDI support, or a \`-mingw\` one for \`-trace\`." \
            "Every package carries \`BUILD_VERSION.txt\` naming the build it came from. Asset names are stable, so these download links stay valid as the build rolls forward.")"

          if [ "$IS_DEV" = "true" ]; then
            # The rolling prerelease is updated in place. It used to be deleted
            # and recreated, which left a window with no dev release at all --
            # and a 502 on the create call turned that window permanent.
            if ! gh release view "$RELEASE_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              retry gh release create "$RELEASE_NAME" \
                --repo "$GITHUB_REPOSITORY" \
                --target "$GITHUB_SHA" \
                --title "Development build $BUILD_VERSION" \
                --notes "$notes" \
                --prerelease
            fi

            retry gh release upload "$RELEASE_NAME" dist/*.zip \
              --repo "$GITHUB_REPOSITORY" --clobber

            # Asset names are stable, so --clobber replaced them in place. Only
            # a package that has gone away entirely needs cleaning up, which is
            # what the old delete-and-recreate was really for.
            keep="$(cd dist && ls ./*.zip | sed 's#^\./##')"
            gh release view "$RELEASE_NAME" --repo "$GITHUB_REPOSITORY" \
              --json assets --jq '.assets[].name' > published_assets.txt
            while read -r asset; do
              [ -n "$asset" ] || continue
              if ! grep -Fxq "$asset" <<<"$keep"; then
                echo "Removing stale asset $asset"
                retry gh release delete-asset "$RELEASE_NAME" "$asset" \
                  --repo "$GITHUB_REPOSITORY" --yes
              fi
            done < published_assets.txt

            # gh release edit --target will not move a tag that already exists,
            # so move the ref directly; otherwise the dev tag drifts behind the
            # build its release names.
            if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_NAME" >/dev/null 2>&1; then
              retry gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/$RELEASE_NAME" \
                -f sha="$GITHUB_SHA" -F force=true >/dev/null
            else
              retry gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" \
                -f ref="refs/tags/$RELEASE_NAME" -f sha="$GITHUB_SHA" >/dev/null
            fi

            retry gh release edit "$RELEASE_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Development build $BUILD_VERSION" \
              --notes "$notes" \
              --prerelease
          elif gh release view "$RELEASE_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # Re-running the workflow for a tag refreshes its assets rather
            # than failing, and leaves the release's draft state alone.
            retry gh release upload "$RELEASE_NAME" dist/*.zip \
              --repo "$GITHUB_REPOSITORY" --clobber
          else
            retry gh release create "$RELEASE_NAME" dist/*.zip \
              --repo "$GITHUB_REPOSITORY" \
              --title "$RELEASE_NAME" \
              --draft \
              --generate-notes
          fi
