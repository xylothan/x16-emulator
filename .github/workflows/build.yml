      - uses: actions/upload-artifact@v4
        with:
          name: x16emu_macos_m1
          path: emu_binaries/*
  build-wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential make libsdl2-dev cmake
      - uses: mymindstorm/setup-emsdk@v14
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Fetch ROM
        uses: ./.github/actions/fetch-rom
        with:
          release: ${{ startsWith(github.ref, 'refs/tags/r') }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Copy ROM symbols
        run: |
          cp latest_rom/*.h src/.
      - name: Build Emulator
        run: |
          mkdir build
          cp latest_rom/rom.bin build
          cd build
          emcmake cmake .. -DENABLE_FLUIDSYNTH=OFF -DENABLE_TRACE=OFF
          emmake make
      - name: Package Emulator
        run: |
          mkdir emu_binaries
          cp build/x16emu.data build/x16emu.html build/x16emu.js build/x16emu.wasm emu_binaries/
          mkdir emu_binaries/webassembly
          cp webassembly/styles.css webassembly/main.js webassembly/jszip.min.js emu_binaries/webassembly/
          file emu_binaries/*
      - uses: actions/upload-artifact@v4
        with:
          name: x16emu_wasm
          path: emu_binaries/*

  # Attach the platform builds to a GitHub release when an r* tag is pushed.
  #
  # Until now this was done by hand: tag, wait for the builds, download each
  # artifact, rename it, and upload it to the release. That is easy to get
  # wrong and, because workflow artifacts expire, impossible to redo later.
  # The naming below reproduces exactly what has been published to date, e.g.
  # x16emu_win64 -> x16emu_win64-r49.zip.
  publish:
    if: startsWith(github.ref, 'refs/tags/r')
    needs:
      - build-win-x86_64
      - build-win-i686
      - build-linux-x86_64
      - build-linux-aarch64
      - build-linux-armhf
      - build-macos-x86_64
      - build-macos-arm64
      - build-wasm
    runs-on: ubuntu-22.04
    permissions:
      # The default token is read-only, and creating a release needs to write.
      contents: write
    steps:
      - name: Collect the platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          # Everything the builds produced, but not the README PDF, which is
          # bundled inside each platform zip rather than published on its own.
          pattern: x16emu_*
      - name: Zip each platform as <artifact>-<tag>.zip
        run: |
          set -euo pipefail
          cd dist
          for dir in */; do
            name="${dir%/}"
            (cd "$name" && zip -qr "../${name}-${GITHUB_REF_NAME}.zip" .)
          done
          ls -l ./*.zip
      - name: Publish a draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Draft, so a tag never publishes to users unreviewed. Re-running the
        # workflow for the same tag refreshes the assets instead of failing.
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/*.zip \
              --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/*.zip \
              --repo "$GITHUB_REPOSITORY" \
              --title "$GITHUB_REF_NAME" \
              --draft \
              --generate-notes
          fi

