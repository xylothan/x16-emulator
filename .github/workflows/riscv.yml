name: RISC-V (on demand)

# Native riscv64 build, run by hand. ubuntu-24.04-riscv is not a GitHub-hosted
# label: it is the RISE project's RISC-V runner service, whose GitHub App has to
# be installed on this account before anything picks the job up -- until then a
# run queues for the day GitHub allows rather than failing.
#
# Kept out of build.yml so that a dispatch costs one job rather than fourteen,
# and so the binary stays a run artifact that publish can never see.
on:
  workflow_dispatch:
  # workflow_dispatch only works once the file is on the default branch, so
  # this is how the PR that adds it gets a run.
  pull_request:
    paths: ['.github/workflows/riscv.yml']

jobs:
  linux-riscv:
    name: linux (riscv64)
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      # No setup-python: it has no riscv64 builds to download, and CMake only
      # wants an interpreter for buildtables.py. gh comes from noble's universe
      # (2.45, new enough for `gh run download -n`) because fetch-rom needs it.
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential make cmake file git python3 \
            libsdl2-dev libfluidsynth-dev libcjson-dev zlib1g-dev
          command -v gh >/dev/null || sudo apt-get install -y gh
          gh --version
      - name: Fetch ROM
        uses: ./.github/actions/fetch-rom
        with:
          release: ${{ github.ref_type == 'tag' }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Copy ROM symbols
        run: cp latest_rom/*.h src/.
      - name: Build Emulator
        run: |
          cmake -B build -DENABLE_FLUIDSYNTH=ON -DENABLE_TRACE=ON
          cmake --build build
      - name: Package Emulator
        run: |
          mkdir emu_binaries
          cp sdcard.img.zip emu_binaries/.
          cp build/x16emu build/makecart emu_binaries/.
          cp latest_rom/rom.bin latest_rom/*.sym emu_binaries/.
          # No version job here, so the commit stands in for a build number.
          echo "$GITHUB_SHA" > emu_binaries/BUILD_VERSION.txt
          file emu_binaries/*
      - uses: actions/upload-artifact@v4
        with:
          name: x16emu_linux-riscv64
          path: emu_binaries/*
